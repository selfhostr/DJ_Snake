name: CI/CD Pipeline

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main]

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Install system dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y ffmpeg

            - name: Install Python dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements-dev.txt

            - name: Lint with flake8
              run: |
                  # Stop the build if there are Python syntax errors or undefined names
                  flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
                  # Exit-zero treats all errors as warnings
                  flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

            - name: Format check with black
              run: |
                  black --check --diff .

            - name: Test bot import and basic functionality
              run: |
                  python -c "
                  import bot
                  import discord
                  print('Bot import successful')
                  print('Discord.py version:', discord.__version__)
                  print('Bot configuration loaded')
                  print('All core modules accessible')
                  "

            - name: Run tests
              run: |
                  pytest -q

    e2e:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up Python
              uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
              with:
                  python-version: "3.13"

            - name: Install system dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y ffmpeg

            - name: Install Python dependencies and Chromium
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements-dev.txt
                  python -m playwright install --with-deps chromium

            - name: Run end-to-end tests
              run: |
                  pytest -m e2e -v -rs --durations=0

    security-scan:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up Python
              uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
              with:
                  python-version: "3.12"

            - name: Install security tools
              run: |
                  pip install bandit safety

            - name: Run Bandit security scan
              run: |
                  bandit -r . -f json -o bandit-report.json || true

            - name: Run Safety dependency scan
              run: |
                  safety check --json --output safety-report.json || true

            - name: Upload security scan results
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: security-reports
                  path: |
                      bandit-report.json
                      safety-report.json
              if: always()

    docker-build:
        runs-on: ubuntu-latest
        needs: test
        if: github.ref == 'refs/heads/main'

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            - name: Build Docker image
              run: |
                  docker build -t discord-music-bot:latest .

            - name: Test Docker image
              run: |
                  docker run --rm discord-music-bot:latest python -c "import bot; print('Docker build successful')"
